          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="105" cy="10" r="3" fill="#FF6B00"/>
  </g>

  <!-- 底部细线 -->
  <line x1="0" y1="59" x2="580" y2="59" stroke="#f0e6d6" stroke-width="1"/>
