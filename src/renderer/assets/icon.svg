<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Serial Protocol Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203A"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 -->
  <rect x="48" y="48" width="928" height="928" rx="210" fill="url(#bg)"/>
  <!-- 极细描边提升精致度 -->
  <rect x="50" y="50" width="924" height="924" rx="208" fill="none" stroke="#2A3A5C" stroke-width="4"/>

  <!-- 攀升方波（3 级台阶） -->
  <path d="M232 672 H452 V460 H652 V292 H812"
        fill="none" stroke="url(#wave)" stroke-width="92"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 白色脉冲点 -->
  <circle cx="912" cy="292" r="44" fill="#FFFFFF"/>
</svg>
